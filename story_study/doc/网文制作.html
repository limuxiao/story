<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网文制作工作台</title>
<style>
  :root {
    --bg: #f5f4f0;
    --panel: #ffffff;
    --ink: #2b2a26;
    --ink-dim: #8a867d;
    --line: #e6e2d9;
    --accent: #b4552d;
    --accent-soft: #f7e8e0;
    --shadow: 0 1px 3px rgba(43,42,38,.06), 0 4px 16px rgba(43,42,38,.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; overflow: hidden;
  }

  /* ===== 左侧：书名列表 ===== */
  .sidebar {
    width: 264px; min-width: 264px; height: 100vh;
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .sidebar-head {
    padding: 18px 16px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-head h1 { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
  .btn-new {
    border: none; background: var(--accent); color: #fff;
    font-size: 12.5px; padding: 7px 12px; border-radius: 8px;
    cursor: pointer; transition: filter .15s;
  }
  .btn-new:hover { filter: brightness(1.08); }
  .book-list { flex: 1; overflow-y: auto; padding: 8px; }
  .book-item {
    padding: 11px 12px; border-radius: 10px; cursor: pointer;
    margin-bottom: 2px; transition: background .12s;
    border: 1px solid transparent;
  }
  .book-item:hover { background: #faf8f4; }
  .book-item.active { background: var(--accent-soft); border-color: #ecd4c8; }
  .book-item .name {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .book-item .meta { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }
  .empty-tip { padding: 40px 20px; text-align: center; color: var(--ink-dim); font-size: 13px; line-height: 1.9; }

  /* ===== 右侧：编辑区 ===== */
  .main { flex: 1; height: 100vh; overflow-y: auto; }
  .main-inner { max-width: 860px; margin: 0 auto; padding: 28px 36px 80px; }
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 22px; position: sticky; top: 0;
    background: var(--bg); padding: 8px 0; z-index: 5;
  }
  .toolbar .spacer { flex: 1; }
  .save-state { font-size: 12.5px; color: var(--ink-dim); }
  .save-state.saved { color: #5a8a4a; }
  .btn-ghost {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font-size: 12.5px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost.danger:hover { border-color: #c0392b; color: #c0392b; }

  .field { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .field-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .field label { font-size: 14px; font-weight: 700; }
  .field .hint { font-size: 12px; color: var(--ink-dim); }
  .field .count { font-size: 11.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .field input[type="text"], .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    background: #fdfcfa; padding: 10px 12px;
    font-family: inherit; font-size: 14px; line-height: 1.75; color: var(--ink);
    resize: vertical; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .field input[type="text"] { font-size: 16px; font-weight: 600; }
  .field input:focus, .field textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(180,85,45,.10);
  }
  .field textarea.short { min-height: 76px; }
  .field textarea.mid { min-height: 150px; }
  .field textarea.tall { min-height: 240px; }

  .placeholder {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); font-size: 14px; text-align: center; line-height: 2;
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-head">
    <h1>我的作品</h1>
    <button class="btn-new" id="btnNew">+ 新建书名</button>
  </div>
  <div class="book-list" id="bookList"></div>
</aside>

<main class="main" id="main">
  <div class="placeholder" id="placeholder">
    从左侧选择一部作品开始编辑<br>或点击「+ 新建书名」创建新作品<br><br>
    所有内容自动保存在本机浏览器（IndexedDB）<br>无需联网，刷新不丢失
  </div>
  <div class="main-inner" id="editor" style="display:none">
    <div class="toolbar">
      <span class="save-state" id="saveState">已保存</span>
      <div class="spacer"></div>
      <button class="btn-ghost" id="btnExport">导出本书 JSON</button>
      <button class="btn-ghost danger" id="btnDelete">删除本书</button>
    </div>

    <div class="field">
      <div class="field-head"><label>书名</label><span class="count" data-count="name"></span></div>
      <input type="text" data-field="name" placeholder="例如：我只是个小怪，凭什么爆史诗">
    </div>

    <div class="field">
      <div class="field-head"><label>立意</label><span class="hint">这本书想表达的最根本的一句话</span><span class="count" data-count="liyì"></span></div>
      <textarea class="short" data-field="liyi" placeholder="这本书为什么值得写？它要戳中读者心里的什么？"></textarea>
    </div>

    <div class="field">
      <div class="field-head"><label>主题</label><span class="hint">贯穿全书的核心命题</span><span class="count" data-count="zhuti"></span></div>
      <textarea class="short" data-field="zhuti" placeholder="例如：身份认同 / 小人物的尊严 / 代价与成长……"></textarea>
    </div>

    <div class="field">
      <div class="field-head"><label>一句话梗概</label><span class="hint">一句话讲清整个故事</span><span class="count" data-count="genggai"></span></div>
      <textarea class="short" data-field="genggai" placeholder="谁，在什么处境，要做什么，最大的阻碍是什么？"></textarea>
    </div>

    <div class="field">
      <div class="field-head"><label>世界观设定</label><span class="hint">世界规则、地理格局、力量体系、底层法则</span><span class="count" data-count="shijieguan"></span></div>
      <textarea class="tall" data-field="shijieguan" placeholder="这个世界运转的铁律是什么？力量怎么分级？有哪些势力？"></textarea>
    </div>

    <div class="field">
      <div class="field-head"><label>人物简介和背景</label><span class="hint">主角、配角、反派：来历、动机、关系</span><span class="count" data-count="renwu"></span></div>
      <textarea class="tall" data-field="renwu" placeholder="每个重要人物：他是谁？他要什么？他为什么非这样不可？"></textarea>
    </div>

    <div class="field">
      <div class="field-head"><label>剧情总纲</label><span class="hint">从头到尾的完整故事线</span><span class="count" data-count="juqing"></span></div>
      <textarea class="tall" data-field="juqing" placeholder="开端 → 发展 → 转折 → 高潮 → 结局，整条因果链写清楚。"></textarea>
    </div>

    <div class="field">
      <div class="field-head"><label>分卷大纲</label><span class="hint">逐卷拆分，每卷的目标与钩子</span><span class="count" data-count="fenjuan"></span></div>
      <textarea class="tall" data-field="fenjuan" placeholder="卷一：……（卷末钩子：……）&#10;卷二：……"></textarea>
    </div>

    <div class="field">
      <div class="field-head"><label>当前问题</label><span class="hint">写清楚你卡在哪，AI 才能帮你解决</span><span class="count" data-count="wenti"></span></div>
      <textarea class="mid" data-field="wenti" placeholder="例如：第二卷中段节奏拖沓；反派动机立不住；某个反转缺乏伏笔……"></textarea>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';

  var DB_NAME = 'wangwen-studio';
  var STORE = 'books';
  var FIELDS = ['name', 'liyi', 'zhuti', 'genggai', 'shijieguan', 'renwu', 'juqing', 'fenjuan', 'wenti'];

  var db = null;
  var books = [];          // 全部作品缓存
  var currentId = null;    // 当前选中作品 id
  var saveTimer = null;

  /* ---------- IndexedDB ---------- */
  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) {
          d.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = function (e) { resolve(e.target.result); };
      req.onerror = function (e) { reject(e.target.error); };
    });
  }
  function tx(mode) { return db.transaction(STORE, mode).objectStore(STORE); }
  function reqToPromise(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function dbAll()        { return reqToPromise(tx('readonly').getAll()); }
  function dbPut(book)    { return reqToPromise(tx('readwrite').put(book)); }
  function dbDelete(id)   { return reqToPromise(tx('readwrite').delete(id)); }

  /* ---------- 数据操作 ---------- */
  function blankBook() {
    var b = { createdAt: Date.now(), updatedAt: Date.now() };
    FIELDS.forEach(function (f) { b[f] = ''; });
    b.name = '未命名作品';
    return b;
  }

  function loadBooks() {
    return dbAll().then(function (list) {
      books = list.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
      renderList();
    });
  }

  function persistCurrent(immediate) {
    if (currentId == null) return Promise.resolve();
    var book = null;
    for (var i = 0; i < books.length; i++) if (books[i].id === currentId) { book = books[i]; break; }
    if (!book) return Promise.resolve();
    FIELDS.forEach(function (f) {
      var el = document.querySelector('[data-field="' + f + '"]');
      if (el) book[f] = el.value;
    });
    book.updatedAt = Date.now();
    setSaveState('保存中…', false);
    return dbPut(book).then(function () {
      setSaveState('已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }), true);
      renderList();
    });
  }

  function scheduleSave() {
    setSaveState('编辑中…', false);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { persistCurrent(); }, 600);
  }

  /* ---------- 渲染 ---------- */
  var listEl = document.getElementById('bookList');
  var placeholderEl = document.getElementById('placeholder');
  var editorEl = document.getElementById('editor');
  var saveStateEl = document.getElementById('saveState');

  function fmtTime(ts) {
    var d = new Date(ts);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function renderList() {
    if (!books.length) {
      listEl.innerHTML = '<div class="empty-tip">还没有作品<br>点击右上角「+ 新建书名」开始</div>';
      return;
    }
    listEl.innerHTML = '';
    books.forEach(function (b) {
      var div = document.createElement('div');
      div.className = 'book-item' + (b.id === currentId ? ' active' : '');
      var total = 0;
      FIELDS.forEach(function (f) { total += (b[f] || '').length; });
      div.innerHTML =
        '<div class="name"></div>' +
        '<div class="meta">' + fmtTime(b.updatedAt) + ' · 共 ' + total + ' 字</div>';
      div.querySelector('.name').textContent = b.name || '未命名作品';
      div.addEventListener('click', function () { selectBook(b.id); });
      listEl.appendChild(div);
    });
  }

  function updateCounts() {
    document.querySelectorAll('[data-field]').forEach(function (el) {
      var f = el.getAttribute('data-field');
      var label = el.closest('.field').querySelector('.count');
      if (label) label.textContent = el.value.length + ' 字';
    });
  }

  function selectBook(id) {
    persistCurrent(); // 切走前先落盘
    currentId = id;
    var book = null;
    for (var i = 0; i < books.length; i++) if (books[i].id === id) { book = books[i]; break; }
    if (!book) return;
    FIELDS.forEach(function (f) {
      var el = document.querySelector('[data-field="' + f + '"]');
      if (el) el.value = book[f] || '';
    });
    placeholderEl.style.display = 'none';
    editorEl.style.display = 'block';
    updateCounts();
    setSaveState('已保存', true);
    renderList();
    document.getElementById('main').scrollTop = 0;
  }

  function setSaveState(text, saved) {
    saveStateEl.textContent = text;
    saveStateEl.className = 'save-state' + (saved ? ' saved' : '');
  }

  /* ---------- 事件 ---------- */
  document.getElementById('btnNew').addEventListener('click', function () {
    var b = blankBook();
    dbPut(b).then(function (id) {
      b.id = id;
      return loadBooks().then(function () {
        selectBook(id);
        var nameInput = document.querySelector('[data-field="name"]');
        nameInput.focus();
        nameInput.select();
      });
    });
  });

  document.getElementById('btnDelete').addEventListener('click', function () {
    if (currentId == null) return;
    var book = null;
    for (var i = 0; i < books.length; i++) if (books[i].id === currentId) { book = books[i]; break; }
    if (!book) return;
    if (!confirm('确定删除《' + (book.name || '未命名作品') + '》？此操作不可恢复。')) return;
    dbDelete(currentId).then(function () {
      currentId = null;
      editorEl.style.display = 'none';
      placeholderEl.style.display = 'flex';
      return loadBooks();
    });
  });

  document.getElementById('btnExport').addEventListener('click', function () {
    persistCurrent().then(function () {
      var book = null;
      for (var i = 0; i < books.length; i++) if (books[i].id === currentId) { book = books[i]; break; }
      if (!book) return;
      var data = JSON.stringify(book, null, 2);
      var blob = new Blob([data], { type: 'application/json;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (book.name || '未命名作品') + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
    });
  });

  document.querySelectorAll('[data-field]').forEach(function (el) {
    el.addEventListener('input', function () { updateCounts(); scheduleSave(); });
  });

  window.addEventListener('beforeunload', function () {
    // 尽力落盘（同步触发，异步写入由浏览器尽量完成）
    if (currentId != null) persistCurrent();
  });

  /* ---------- 启动 ---------- */
  openDB().then(function (d) {
    db = d;
    return loadBooks();
  }).catch(function (err) {
    alert('IndexedDB 初始化失败：' + err);
  });
})();
</script>
</body>
</html>
