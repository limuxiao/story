<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵感制造机 · DeepSeek 版</title>
<style>
  :root{
    --bg:#16121d; --bg2:#221b2e; --card:#2a2238; --line:#3a3050;
    --gold:#c9a227; --purple:#9b6cf0; --text:#e9e3f5; --muted:#9a8fb0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(1200px 600px at 70% -10%, #2c2140 0%, var(--bg) 60%);
    color:var(--text);
    font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 18px 90px;
  }
  h1{ font-size:32px; letter-spacing:8px; margin:0 0 4px;
    background:linear-gradient(90deg,var(--gold),var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub{color:var(--muted); font-size:13px; letter-spacing:2px; margin-bottom:22px; text-align:center;}
  .panel{ width:100%; max-width:980px; background:var(--bg2); border:1px solid var(--line);
    border-radius:12px; padding:16px 18px; margin-bottom:22px; }
  .panel label{font-size:12px; letter-spacing:2px; color:var(--muted);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:8px;}
  input[type=text],input[type=password]{
    flex:1; min-width:200px; background:#1c1726; border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit;
  }
  .hook{ max-width:980px; width:100%; background:linear-gradient(135deg,rgba(201,162,39,.12),rgba(155,108,240,.12));
    border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-bottom:22px;
    line-height:1.8; font-size:16px; text-align:center; min-height:54px; }
  .hook b{color:var(--gold);} .hook i{color:var(--purple); font-style:normal;}
  .grid{ width:100%; max-width:980px; display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  @media(max-width:680px){ .grid{grid-template-columns:1fr;} }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; position:relative; min-height:140px; }
  .card .tag{display:inline-block; font-size:12px; letter-spacing:2px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:2px 12px; margin-bottom:8px;}
  .card h3{margin:0 0 6px; font-size:20px; color:var(--gold); letter-spacing:1px;}
  .card .desc{font-size:12px; color:var(--muted); line-height:1.6; margin:4px 0;}
  .card .tip{font-size:13px; line-height:1.65; color:var(--text);
    border-left:2px solid var(--purple); padding-left:9px; margin-top:6px;}
  .card .tip b{color:var(--purple);}
  .card .re{position:absolute; top:12px; right:12px; cursor:pointer; background:transparent;
    border:1px solid var(--line); color:var(--muted); border-radius:8px; width:28px; height:28px; font-size:14px;}
  .card .re:hover{color:var(--gold); border-color:var(--gold);}
  .actions{margin-top:26px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  button.gen{cursor:pointer; border:none; border-radius:10px; padding:13px 30px; font-size:15px;
    letter-spacing:3px; color:#1a1422; font-weight:700;
    background:linear-gradient(90deg,var(--gold),var(--purple)); box-shadow:0 6px 24px rgba(155,108,240,.3);}
  button.gen:hover{transform:translateY(-2px);}
  button.ghost{cursor:pointer; border:1px solid var(--line); color:var(--muted); background:transparent;
    border-radius:10px; padding:13px 22px; font-size:14px; letter-spacing:2px;}
  button.ghost:hover{color:var(--gold); border-color:var(--gold);}
  button.ghost:disabled{opacity:.4; cursor:not-allowed;}
  .result{ width:100%; max-width:980px; margin-top:26px; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:18px 20px; display:none;}
  .result.show{display:block;}
  .result .rhead{display:flex; align-items:center; gap:14px; margin-bottom:12px;}
  .score{ font-size:30px; font-weight:700; color:var(--gold);
    background:#1c1726; border:1px solid var(--gold); border-radius:10px; padding:4px 14px; }
  .result .rhead span{color:var(--muted); font-size:13px; letter-spacing:2px;}
  #ds-text{white-space:pre-wrap; line-height:1.85; font-size:15px; color:var(--text);}
  .err{color:#e0707c;}
</style>
</head>
<body>
  <h1>灵 感 制 造 机</h1>
  <div class="sub">四池各 50 条 · 随机抽取 · 交予 DeepSeek 生成微设定并量化评分</div>

  <div class="panel">
    <label>DeepSeek API Key（仅在本地浏览器内存中使用，不另存）</label>
    <div class="row">
      <input type="password" id="apikey" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off" />
      <input type="text" id="model" value="deepseek-chat" style="max-width:200px" title="模型名，可改为 deepseek-reasoner" />
    </div>
  </div>

  <div class="hook" id="hook">点击下方“生成灵感”开始。</div>

  <div class="grid">
    <div class="card">
      <button class="re" data-k="w" title="换世界观">↻</button>
      <span class="tag">世界观</span>
      <h3 id="w-name">—</h3>
      <div class="desc" id="w-desc"></div>
      <div class="tip" id="w-tip"></div>
    </div>
    <div class="card">
      <button class="re" data-k="c" title="换人物">↻</button>
      <span class="tag">人物（职业）</span>
      <h3 id="c-name">—</h3>
      <div class="tip" id="c-tip"></div>
    </div>
    <div class="card">
      <button class="re" data-k="p" title="换地点">↻</button>
      <span class="tag">地点</span>
      <h3 id="p-name">—</h3>
    </div>
    <div class="card">
      <button class="re" data-k="e" title="换事件">↻</button>
      <span class="tag">事件（要做什么）</span>
      <h3 id="e-name">—</h3>
    </div>
  </div>

  <div class="actions">
    <button class="gen" id="gen">生成灵感</button>
    <button class="ghost" id="ask" disabled>交给 DeepSeek 生成微设定并评分</button>
    <button class="ghost" id="copy">复制梗概</button>
  </div>

  <div class="result" id="result">
    <div class="rhead">
      <div class="score" id="score">—</div>
      <span>DeepSeek 评分（0–10，越高越有故事潜力）</span>
    </div>
    <div id="ds-text"></div>
  </div>

const pick = a => a[Math.floor(Math.random()*a.length)];
let cur = {w:null,c:null,p:null,e:null};

function renderHook(){
  if(!cur.w) return;
  document.getElementById('hook').innerHTML =
    `在<b>${cur.w.name}</b>的<i>${cur.p}</i>，一名<b>${cur.c.name}</b>必须<i>${cur.e}</i>。`;
}
function setW(){ const w=pick(worldviews); cur.w=w;
  document.getElementById('w-name').textContent=w.name;
  document.getElementById('w-desc').textContent=w.desc;
  document.getElementById('w-tip').innerHTML='<b>灵感：</b>'+w.tip; }
function setC(){ const c=pick(characters); cur.c=c;
  document.getElementById('c-name').textContent=c.name;
  document.getElementById('c-tip').innerHTML='<b>灵感：</b>'+c.tip; }
function setP(){ const p=pick(places); cur.p=p; document.getElementById('p-name').textContent=p; }
function setE(){ const e=pick(events); cur.e=e; document.getElementById('e-name').textContent=e; }

function generate(){ setW(); setC(); setP(); setE(); renderHook();
  document.getElementById('ask').disabled = false;
  document.getElementById('result').classList.remove('show'); }

function refresh(k){ if(k==='w')setW(); if(k==='c')setC(); if(k==='p')setP(); if(k==='e')setE(); renderHook(); }

document.getElementById('gen').onclick = generate;
document.querySelectorAll('.re').forEach(b=> b.onclick=()=>refresh(b.dataset.k));
document.getElementById('copy').onclick = ()=>{
  if(!cur.w) return;
  const t = `在${cur.w.name}的${cur.p}，一名${cur.c.name}必须${cur.e}。`;
  navigator.clipboard?.writeText(t);
  const b=document.getElementById('copy'); const old=b.textContent;
  b.textContent='已复制'; setTimeout(()=>b.textContent=old,1200);
};

function buildPrompt(){
  return `请基于以下随机灵感组合进行创作：
【世界观】${cur.w.name}——${cur.w.desc} 灵感方向：${cur.w.tip}
【人物（职业）】${cur.c.name} 灵感方向：${cur.c.tip}
【地点】${cur.p}
【事件（要做什么）】${cur.e}

要求：
1）先写一段约200字的“微设定”，将这个组合扩写成可落笔的故事种子（要有画面感、有冲突雏形、有钩子）；
2）再评估它是否构成一个好故事，输出单独一行“评分：X/10”（0–10，越高越有潜力）；
3）列出 2–3 个亮点与 2–3 个风险（为何可能写崩）。`;
}

document.getElementById('ask').onclick = async ()=>{
  const key = document.getElementById('apikey').value.trim();
  if(!key){ alert('请先填入 DeepSeek API Key'); return; }
  if(!cur.w){ alert('请先生成灵感'); return; }
  const model = document.getElementById('model').value.trim() || 'deepseek-chat';
  const btn = document.getElementById('ask');
  btn.disabled = true; btn.textContent = 'DeepSeek 生成中…';
  const result = document.getElementById('result');
  result.classList.add('show');
  const textEl = document.getElementById('ds-text');
  const scoreEl = document.getElementById('score');
  textEl.className = ''; textEl.textContent = '请求中…'; scoreEl.textContent='—';
  try{
    const res = await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
      body: JSON.stringify({
        model,
        messages:[
          {role:'system', content:'你是一位资深故事编辑与创意写作教练，语言凝练、有洞察，不啰嗦。'},
          {role:'user', content: buildPrompt()}
        ],
        temperature:0.85, stream:false
      })
    });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error('HTTP '+res.status+(t? ' '+t.slice(0,200):''));
    }
    const data = await res.json();
    const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '（空响应）';
    textEl.textContent = text;
    const m = text.match(/评分[：:]\s*([0-9]+(?:\.[0-9]+)?)\s*\/?\s*10/);
    scoreEl.textContent = m ? parseFloat(m[1]).toFixed(1) : '—';
  }catch(err){
    textEl.className = 'err';
    textEl.textContent = '调用失败：'+err.message+
      '\n\n若提示跨域/CORS 或网络错误，通常是浏览器直接调用 API 被限制；可在允许跨域的环境，或通过本地代理/后端中转后使用。';
  }finally{
    btn.disabled = false; btn.textContent = '交给 DeepSeek 生成微设定并评分';
  }
};
