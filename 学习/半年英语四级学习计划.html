<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>半年英语四级学习计划 · 200天4000词</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e9f2;
        --accent: #5b6ee1;
        --accent-soft: #eef1ff;
        --accent-deep: #4054c7;
        --gold: #d9a441;
        --gold-soft: #fff8e8;
        --green: #2f9e73;
        --green-soft: #e9f8f1;
        --shadow: 0 8px 28px rgba(31, 41, 55, 0.07);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 15px;
        line-height: 1.7;
        letter-spacing: 0.01em;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }

      /* ---------- 顶部 header ---------- */
      .site-header {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .header-inner {
        max-width: 1400px;
        margin: 0 auto;
        padding: 14px 26px;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        flex: none;
        background: linear-gradient(135deg, var(--accent), #8b9af3);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.5px;
        box-shadow: 0 6px 16px rgba(91, 110, 225, 0.28);
      }
      .brand h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 800;
        letter-spacing: 0.2px;
        white-space: nowrap;
      }
      .brand p {
        margin: 1px 0 0;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .header-spacer {
        flex: 1;
      }
      .header-stat {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      .stat-pill {
        background: var(--accent-soft);
        color: var(--accent-deep);
        border: 1px solid #dde3ff;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .progress-box {
        min-width: 172px;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .progress-track {
        height: 7px;
        background: #e8ecf6;
        border-radius: 99px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), #8b9af3);
        border-radius: 99px;
        transition: width 0.3s ease;
      }

      /* ---------- 中间 container ---------- */
      .layout {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px 26px 40px;
        display: flex;
        gap: 22px;
        align-items: flex-start;
      }
      .sidebar {
        width: 296px;
        flex: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        position: sticky;
        top: 88px;
        max-height: calc(100vh - 112px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .side-head {
        padding: 16px 16px 10px;
        border-bottom: 1px solid var(--line);
      }
      .side-head h2 {
        font-size: 13px;
        margin: 0 0 10px;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .search-box {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
        background: #fbfcff;
        outline: none;
        transition: 0.2s;
      }
      .search-box:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(91, 110, 225, 0.12);
      }
      .side-scroll {
        overflow-y: auto;
        padding: 10px 10px 18px;
        flex: 1;
      }
      .side-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .side-scroll::-webkit-scrollbar-thumb {
        background: #d9dfee;
        border-radius: 9px;
      }

      .nav-special {
        width: 100%;
        text-align: left;
        border: 1px solid #f0dfb6;
        background: linear-gradient(120deg, var(--gold-soft), #fffdf6);
        border-radius: 12px;
        padding: 11px 12px;
        margin-bottom: 10px;
        display: flex;
        gap: 10px;
        align-items: center;
        color: #8a6412;
        font-weight: 700;
        font-size: 14px;
        transition: 0.18s;
      }
      .nav-special:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(217, 164, 65, 0.18);
      }
      .nav-special.active {
        background: linear-gradient(120deg, #f7e6bc, #ffefc9);
        box-shadow: inset 3px 0 0 var(--gold);
      }
      .nav-special .ico {
        font-size: 18px;
        line-height: 1;
      }
      .nav-special small {
        display: block;
        font-weight: 500;
        font-size: 11px;
        color: #a98332;
      }

      .month-group {
        margin-bottom: 6px;
        border: 1px solid transparent;
        border-radius: 11px;
        overflow: hidden;
      }
      .month-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 9px;
        text-align: left;
        background: #f7f9fd;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px 11px;
        font-weight: 700;
        font-size: 13px;
        color: #303d57;
        transition: 0.16s;
      }
      .month-toggle:hover {
        background: #eef2fd;
      }
      .month-toggle .chevron {
        transition: transform 0.2s;
        color: var(--muted);
        font-size: 12px;
      }
      .month-group.open .month-toggle .chevron {
        transform: rotate(90deg);
      }
      .month-toggle .mno {
        background: var(--accent);
        color: #fff;
        border-radius: 7px;
        padding: 1px 7px;
        font-size: 11px;
      }
      .month-toggle .mlabel {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .day-list {
        display: none;
        padding: 6px 0 4px 10px;
        border-left: 2px dashed #e1e7f5;
        margin-left: 17px;
      }
      .month-group.open .day-list {
        display: block;
      }
      .day-item {
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        border-radius: 9px;
        padding: 6px 9px;
        margin: 2px 0;
        font-size: 12.5px;
        color: #4b5568;
        display: flex;
        align-items: center;
        gap: 7px;
        transition: 0.14s;
      }
      .day-item:hover {
        background: #f1f4fc;
        padding-left: 13px;
      }
      .day-item.active {
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-weight: 700;
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .day-item .dnum {
        font-variant-numeric: tabular-nums;
        color: #98a2b8;
        font-size: 11px;
        font-weight: 700;
        width: 26px;
        flex: none;
      }
      .day-item.active .dnum {
        color: var(--accent);
      }
      .day-item .dtheme {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tag {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 5px;
        font-weight: 700;
        flex: none;
        white-space: nowrap;
      }
      .tag-week {
        background: #e6f6ef;
        color: #1e7d59;
      }
      .tag-month {
        background: #fff0d6;
        color: #a06f13;
      }
      .tag-done {
        background: #e8ecf6;
        color: #7c86a0;
      }
      .day-item.done .dnum::after {
        content: "✓";
        color: var(--green);
        margin-left: 1px;
      }
      .no-result {
        padding: 14px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        display: none;
      }

      .wrapper {
        flex: 1;
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 26px 30px 34px;
      }
      .wrapper-inner {
        animation: fadeIn 0.28s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .hero {
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
        margin-bottom: 22px;
      }
      .hero-top {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .crumb {
        font-size: 12px;
        color: var(--muted);
      }
      .crumb b {
        color: var(--accent-deep);
      }
      .hero h2 {
        font-size: 25px;
        margin: 4px 0 4px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }
      .hero .en-title {
        font-size: 13px;
        color: var(--muted);
        font-style: italic;
        margin: 0 0 8px;
      }
      .hero-desc {
        color: #485466;
        font-size: 13.5px;
        margin: 4px 0 0;
      }
      .badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .badge {
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 11.5px;
        font-weight: 700;
      }
      .badge-m {
        background: var(--accent-soft);
        color: var(--accent-deep);
      }
      .badge-w {
        background: var(--green-soft);
        color: #1e7d59;
      }
      .badge-y {
        background: var(--gold-soft);
        color: #9a6e17;
      }

      .day-nav {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .nav-btn {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 9px;
        padding: 7px 13px;
        font-size: 12.5px;
        color: #4b5568;
        font-weight: 600;
        transition: 0.16s;
      }
      .nav-btn:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent-deep);
        background: var(--accent-soft);
      }
      .nav-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .done-btn {
        border: 1px solid #bfe6d6;
        background: var(--green-soft);
        color: #1e7d59;
      }
      .done-btn.done {
        background: #1e7d59;
        color: #fff;
        border-color: #1e7d59;
      }

      .section {
        margin: 24px 0 0;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .section-head .no {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 13px;
        flex: none;
      }
      .section-head h3 {
        font-size: 17px;
        margin: 0;
        font-weight: 800;
      }
      .section-head small {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 500;
      }

      .word-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 11px;
      }
      .word-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px 15px;
        background: #fcfdff;
        transition: 0.18s;
      }
      .word-card:hover {
        border-color: #c9d3f8;
        box-shadow: 0 6px 18px rgba(91, 110, 225, 0.1);
        transform: translateY(-2px);
      }
      .word-card .wtop {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .word-card .w {
        font-size: 17px;
        font-weight: 800;
        color: #1e2a44;
        letter-spacing: 0.2px;
      }
      .word-card .pos {
        font-size: 10.5px;
        color: var(--accent-deep);
        background: var(--accent-soft);
        padding: 1px 6px;
        border-radius: 5px;
        font-weight: 700;
      }
      .word-card .mean {
        color: #374151;
        font-size: 13px;
        margin-top: 3px;
        font-weight: 600;
      }
      .word-card .ex {
        color: #5b667a;
        font-size: 12.3px;
        margin-top: 7px;
        line-height: 1.65;
        border-top: 1px dashed #e6eaf3;
        padding-top: 7px;
      }
      .word-card .ex .en {
        display: block;
      }
      .word-card .ex .zh {
        display: block;
        color: #8b95a8;
        font-size: 11.5px;
        margin-top: 2px;
      }
      mark {
        background: #fff0bf;
        color: #8a5b00;
        padding: 0 2px;
        border-radius: 3px;
        font-weight: 600;
      }

      .sentence-list {
        counter-reset: s;
        display: grid;
        gap: 9px;
      }
      .sentence-item {
        border-left: 3px solid #cfd8f6;
        background: #fafbff;
        border-radius: 0 10px 10px 0;
        padding: 10px 14px;
        position: relative;
      }
      .sentence-item::before {
        counter-increment: s;
        content: counter(s);
        position: absolute;
        left: -13px;
        top: 11px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #e6ebfb;
        color: var(--accent-deep);
        font-size: 11px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sentence-item .en {
        font-size: 14.5px;
        color: #1f2a40;
        line-height: 1.7;
      }
      .sentence-item .zh {
        font-size: 12.5px;
        color: #78839a;
        margin-top: 2px;
      }

      .passage {
        border: 1px solid #e7e2d2;
        background: linear-gradient(180deg, #fffdf7, #fffefb);
        border-radius: 14px;
        padding: 20px 22px;
      }
      .passage h4 {
        margin: 0 0 4px;
        font-size: 16px;
        color: #6b5317;
        font-weight: 800;
      }
      .passage .ptag {
        font-size: 11px;
        color: #a58a4a;
        margin-bottom: 12px;
      }
      .passage p {
        margin: 0 0 10px;
        font-size: 14.6px;
        line-height: 1.95;
        color: #3c3a31;
      }
      .passage .zh-line {
        font-size: 12.5px;
        color: #94886c;
        line-height: 1.8;
        border-top: 1px dashed #ece4cf;
        padding-top: 10px;
        margin-top: 12px;
      }
      .passage .tip {
        margin-top: 12px;
        background: #fff6dd;
        border: 1px solid #f2e3b7;
        border-radius: 9px;
        padding: 9px 12px;
        font-size: 12px;
        color: #8a6a1d;
      }

      .review-box {
        border: 1px solid #cfe8dc;
        background: linear-gradient(180deg, #f3fcf7, #fbfefc);
        border-radius: 14px;
        padding: 18px 20px;
        margin-top: 24px;
      }
      .review-box h3 {
        margin: 0 0 4px;
        font-size: 17px;
        color: #166b4c;
        font-weight: 800;
      }
      .review-box .sub {
        font-size: 12px;
        color: #5d8a76;
        margin-bottom: 14px;
      }
      .review-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 7px;
      }
      .review-chip {
        background: #fff;
        border: 1px solid #dcefe5;
        border-radius: 8px;
        padding: 6px 9px;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .review-chip b {
        color: #176b4e;
      }
      .review-chip span {
        color: #6b7d75;
        text-align: right;
        font-size: 11.5px;
      }
      .quiz {
        margin-top: 16px;
        background: #fff;
        border: 1px dashed #a9d6c1;
        border-radius: 11px;
        padding: 14px 16px;
      }
      .quiz h4 {
        margin: 0 0 9px;
        font-size: 13.5px;
        color: #166b4c;
      }
      .quiz-row {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 7px 0;
        border-top: 1px solid #eef4f1;
        font-size: 13px;
        flex-wrap: wrap;
      }
      .quiz-row .qi {
        width: 20px;
        color: #91a89d;
        font-size: 11px;
        font-weight: 700;
        flex: none;
      }
      .quiz-row .qm {
        color: #374151;
        flex: 1;
        min-width: 150px;
      }
      .quiz-row .qa {
        color: #166b4c;
        font-weight: 800;
        opacity: 0;
        transition: 0.2s;
        filter: blur(4px);
      }
      .quiz-row.reveal .qa {
        opacity: 1;
        filter: none;
      }
      .quiz-row button {
        border: 1px solid #bfe0d1;
        background: #f2fbf6;
        color: #166b4c;
        border-radius: 7px;
        padding: 3px 9px;
        font-size: 11px;
        font-weight: 700;
      }

      .summary-box {
        border: 1px solid #f0dfba;
        background: linear-gradient(180deg, #fffaf0, #fffdf8);
        border-radius: 14px;
        padding: 18px 20px;
        margin-top: 24px;
      }
      .summary-box h3 {
        margin: 0 0 4px;
        font-size: 17px;
        color: #8a6412;
        font-weight: 800;
      }
      .summary-box .sub {
        font-size: 12px;
        color: #a98b4f;
        margin-bottom: 14px;
      }
      .sum-stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .sum-stat {
        background: #fff;
        border: 1px solid #f0e3c5;
        border-radius: 10px;
        padding: 8px 14px;
        min-width: 96px;
        text-align: center;
      }
      .sum-stat b {
        display: block;
        font-size: 19px;
        color: #a06f13;
        line-height: 1.2;
      }
      .sum-stat span {
        font-size: 11px;
        color: #a18c63;
      }
      .week-block {
        margin-top: 12px;
      }
      .week-block h4 {
        font-size: 12.5px;
        color: #8a6a1d;
        margin: 0 0 6px;
        font-weight: 800;
      }
      .summary-text {
        font-size: 13.5px;
        line-height: 1.85;
        color: #6b5a35;
        background: #fff;
        border: 1px dashed #ebd9ab;
        border-radius: 9px;
        padding: 12px 14px;
        margin-top: 14px;
      }

      /* ---------- 影视推荐 ---------- */
      .film-intro {
        background: linear-gradient(120deg, #fff9ea, #fffdf7);
        border: 1px solid #f0e2bd;
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 18px;
      }
      .film-intro h3 {
        margin: 0 0 6px;
        color: #7d5b10;
        font-size: 16px;
      }
      .film-intro p {
        margin: 0;
        color: #8a7444;
        font-size: 13px;
        line-height: 1.8;
      }
      .film-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 14px;
      }
      .film-card {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 17px 18px;
        background: #fcfdff;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
      }
      .film-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 24px rgba(31, 41, 55, 0.09);
        border-color: #e6dcbf;
      }
      .film-card .ftop {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }
      .film-card h4 {
        font-size: 17px;
        margin: 0;
        color: #1f2a40;
        font-weight: 800;
      }
      .film-card .fcn {
        font-size: 12px;
        color: var(--muted);
        margin-top: 1px;
      }
      .film-card .fmeta {
        font-size: 11px;
        color: #a98b4f;
        background: var(--gold-soft);

        const words = da.words;
        const en =
          mo.intro + " " + words.map((w) => w[3]).join(" ") + " " + mo.outro;
        const zh = mo.introZh + words.map((w) => w[4]).join("") + mo.outroZh;
        return `<div class="section"><div class="section-head"><div class="no">3</div><h3>短文阅读</h3><small>${esc(da.theme)} · 约 ${en.split(/\s+/).length} 词</small></div>
    <div class="passage"><h4>${esc(da.theme)}</h4><div class="ptag">Reading Passage · Day ${String((mo.m - 1) * 10 + da.d).padStart(3, "0")}</div>
      <p>${highlight(en, words)}</p>
      <div class="zh-line"><b>参考译文：</b>${esc(zh)}</div>
      <div class="tip">阅读建议：先通读一遍抓住大意，再圈出今天 20 个目标词，最后合上页面口头复述 3 句话。</div>
    </div></div>`;
      }
      function collectDays(count, endGlobal) {
        const out = [];
        for (let g = endGlobal - count + 1; g <= endGlobal; g++) {
          const m = Math.ceil(g / 10);
          const d = ((g - 1) % 10) + 1;
          out.push(day(m, d));
        }
        return out;
      }
      function reviewSection(m, d) {
        const g = (m - 1) * 10 + d;
        const blockDays = collectDays(10, g);
        const all = blockDays.flatMap((x) => x.words);
        const chips = all
          .map(
            (w) =>
              `<div class="review-chip"><b>${esc(w[0])}</b><span>${esc(w[2])}</span></div>`,
          )
          .join("");
        const picks = [9, 39, 69, 99, 129, 159, 189].map((i) => all[i]);
        const quiz = picks
          .map(
            (w, i) =>
              `<div class="quiz-row"><span class="qi">${i + 1}</span><span class="qm">${esc(w[2])}</span><span class="qa">${esc(w[0])}</span><button type="button">显示答案</button></div>`,
          )
          .join("");
        return `<div class="review-box"><h3>第 ${g / 10} 个十日 · 当周复习</h3>
    <div class="sub">第 ${g - 9}–${g} 天 · ${all.length} 个单词 · 先速览，再自测</div>
    <div class="review-grid">${chips}</div>
    <div class="quiz"><h4>快速自测：看中文，回想英文单词</h4>${quiz}</div></div>`;
      }
      function summarySection(m, d) {
        const g = (m - 1) * 10 + d;
        const monthDays = collectDays(30, g);
        const blocks = [0, 1, 2].map((i) => {
          const words = monthDays.slice(i * 10, i * 10 + 10).flatMap((x) => x.words);
          return `<div class="week-block"><h4>第 ${i + 1} 旬 · 10 天词汇回顾（第 ${g - 29 + i * 10}–${g - 20 + i * 10} 天）</h4>
      <div class="review-grid">${words.map((w) => `<div class="review-chip"><b>${esc(w[0])}</b><span>${esc(w[2])}</span></div>`).join("")}</div></div>`;
        }).join("");
        const themes = monthDays
          .map((x) => x.theme)
          .filter((v, i, a) => a.indexOf(v) === i)
          .slice(0, 8);
        const final = g === 200;
        return `<div class="summary-box"><h3>${final ? "全程结业复盘 · 4000 词达成" : "第 " + (g / 30) + " 月 · 当月总结"}</h3>
    <div class="sub">第 ${g - 29}–${g} 天 · 30 天完整回顾</div>
    <div class="sum-stats">
      <div class="sum-stat"><b>30</b><span>学习天</span></div>
      <div class="sum-stat"><b>3</b><span>旬</span></div>
      <div class="sum-stat"><b>600</b><span>本月词汇</span></div>
      <div class="sum-stat"><b>30</b><span>短文篇数</span></div>
    </div>
    <div class="summary-text">这 30 天我们围绕 ${esc(themes.join("、"))} 等主题展开。每天 20 个新词、20 个例句和 1 段短文，把零散的单词放进了真实语境。${final ? "至此你已走完全部 200 天，完成 4000 个独立词的积累——这已经覆盖了英语四级的核心词汇量。请继续保持朗读与复述的习惯，让词汇真正变成能用的语言。" : "每 10 天的复习帮你把短期记忆变成长久印象，请把仍不熟悉的词标记出来，带到下一阶段继续巩固。"} 下一步：保持每天朗读与复述的习惯，让词汇真正变成能用的语言。</div>
    ${blocks}</div>`;
      }
      function renderDay() {
        const mo = month(state.m),
          da = day(state.m, state.d);
        const done = state.done[key(state.m, state.d)];
        const g = (state.m - 1) * 10 + state.d;
        let extra = "";
        if (g % 10 === 0 && g !== 200) extra += reviewSection(state.m, state.d);
        if (g % 30 === 0 || g === 200) extra += summarySection(state.m, state.d);
        const prevD = g > 1
          ? { m: Math.ceil((g - 1) / 10), d: ((g - 2) % 10) + 1 }
          : null;
        const nextD = g < 200
          ? { m: Math.ceil((g + 1) / 10), d: (g % 10) + 1 }
          : null;
        return `<div class="hero">
    <div class="hero-top"><span class="crumb">首页 / 第 ${state.m} 单元 / <b>第 ${(state.m - 1) * 10 + state.d} 天</b></span>
      <span class="badge badge-m">${esc(mo.name)}</span>
      ${g % 10 === 0 && g !== 200 ? '<span class="badge badge-w">含当周复习</span>' : ""}
      ${g % 30 === 0 || g === 200 ? '<span class="badge badge-y">含月总结</span>' : ""}</div>
    <h2>Day ${String(g).padStart(3, "0")} · ${esc(da.theme)}</h2>
    <p class="en-title">${esc(mo.en)}</p>
    <p class="hero-desc">${esc(mo.theme)}</p>
    <div class="day-nav">
      <button class="nav-btn" data-go="${prevD ? prevD.m + "," + prevD.d : ""}" ${prevD ? "" : "disabled"}>← 前一天</button>
      <button class="nav-btn" data-go="${nextD ? nextD.m + "," + nextD.d : ""}" ${nextD ? "" : "disabled"}>后一天 →</button>
      <button class="nav-btn" data-go="films">影视推荐</button>
      <button class="nav-btn done-btn ${done ? "done" : ""}" id="doneBtn">${done ? "✓ 已完成" : "标记完成"}</button>
    </div>
  </div>
  ${wordSection(da.words)}${sentenceSection(da.words)}${passageSection(mo, da)}${extra}`;
      }
      function renderFilms() {
        return `<div class="film-intro"><h3>用原声影视，把学过的词“听活”</h3>
    <p>以下 14 部作品均为英语原声，按入门到进阶排列。建议先无字幕看一遍抓大意，第二遍开英文字幕精听，第三遍挑 1 分钟跟读。每部都附推荐理由、剧情简介与可执行的练习建议，配合 daily 20 词一起食用效果更好。</p></div>
    <div class="film-grid">${FILMS.map(
      (f) => `<div class="film-card">
      <div class="ftop"><div><h4>${esc(f.title)}</h4><div class="fcn">${esc(f.cn)} · ${esc(f.year)}</div></div><span class="fmeta">${esc(f.genre)}</span></div>
      <div class="flevel">推荐难度：${esc(f.level)}</div>
      <div class="film-row"><b>推荐理由</b>${esc(f.reason)}</div>
      <div class="film-row"><b>内容简介</b>${esc(f.synopsis)}</div>
      <div class="film-quote">“${esc(f.quote)}”<span>${esc(f.quoteZh)}</span></div>
      <div class="film-tips">学习建议：${esc(f.tips)}</div>
    </div>`,
    ).join("")}</div>`;
      }
      function render() {
        const c = $("#content");
        if (state.view === "day") c.innerHTML = renderDay();
        else if (state.view === "films") c.innerHTML = renderFilms();
        else c.innerHTML = renderOverview();

        c.querySelectorAll("[data-go]").forEach((b) =>
          b.addEventListener("click", () => {
            const v = b.dataset.go;
            if (!v) return;
            if (v === "films") {
              state.view = "films";
            } else {
              const [m, d] = v.split(",").map(Number);
              state.view = "day";
              state.m = m;
              state.d = d;
              state.open[m] = true;
            }
            render();
          }),
        );
        if (state.view === "overview")
          c.querySelectorAll(".mcard").forEach((b) =>
            b.addEventListener("click", () => {
              state.view = "day";
              state.m = +b.dataset.m;
              state.d = 1;
              state.open[state.m] = true;
              render();
            }),
          );
        if (state.view === "day") {
          const btn = $("#doneBtn");
          btn.addEventListener("click", () => {
            const k = key(state.m, state.d);
            state.done[k] = !state.done[k];
            saveDone();
            updateProgress();
            render();
          });
          c.querySelectorAll(".quiz-row").forEach((row) =>
            row.querySelector("button").addEventListener("click", (e) => {
              row.classList.add("reveal");
              e.target.textContent = "已显示";
            }),
          );
        }
        buildNav($("#search").value);
        updateProgress();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      $("#search").addEventListener("input", (e) => buildNav(e.target.value));
      render();
    </script></script></script>
  </body>
</html>
