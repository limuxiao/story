<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>废弃船厂：最后一班 · Three.js FPS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080a0d;
      }
      body {
        font-family: "SF Mono", Menlo, Consolas, monospace;
        color: #d8e2e8;
        user-select: none;
      }
      #gl {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        opacity: 0.13;
        background: repeating-linear-gradient(
          0deg,
          transparent 0 2px,
          rgba(0, 0, 0, 0.35) 2px 3px
        );
      }
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        box-shadow: inset 0 0 180px 40px rgba(0, 0, 0, 0.72);
      }
      #damage {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 6;
        opacity: 0;
        box-shadow: inset 0 0 160px 60px rgba(190, 25, 20, 0.85);
      }
      #flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 6;
        opacity: 0;
        background: #ffe6b0;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 7;
        display: none;
      }
      #hud.on {
        display: block;
      }
      .panel-hud {
        position: absolute;
        padding: 10px 14px;
        background: rgba(8, 14, 18, 0.55);
        border: 1px solid rgba(150, 190, 205, 0.18);
        backdrop-filter: blur(4px);
        letter-spacing: 0.06em;
      }
      #hpBox {
        top: 22px;
        left: 22px;
        min-width: 210px;
      }
      #hpLabel {
        font-size: 11px;
        color: #8fa6b2;
        margin-bottom: 6px;
      }
      #hpNum {
        font-size: 26px;
        font-weight: 700;
        color: #e7f1f4;
        line-height: 1;
      }
      #hpBar {
        height: 5px;
        margin-top: 8px;
        background: rgba(255, 255, 255, 0.12);
      }
      #hpFill {
        height: 100%;
        width: 100%;
        background: #cf6a42;
        transition: width 0.15s;
      }
      #statBox {
        top: 22px;
        right: 22px;
        text-align: right;
        font-size: 12px;
        line-height: 1.9;
        color: #a8bec8;
      }
      #statBox b {
        color: #e8d2a0;
        font-size: 15px;
        font-weight: 600;
      }
      #ammoBox {
        bottom: 26px;
        right: 26px;
        text-align: right;
      }
      #ammoNum {
        font-size: 34px;
        font-weight: 700;
        color: #f0e6cf;
        line-height: 1;
      }
      #ammoNum small {
        font-size: 14px;
        color: #8299a4;
        font-weight: 400;
      }
      #reload {
        font-size: 11px;
        color: #e8b86a;
        height: 14px;
        margin-top: 6px;
      }
      #hintBox {
        bottom: 28px;
        left: 26px;
        font-size: 11px;
        color: #7d949f;
        line-height: 1.8;
      }
      #waveMsg {
        position: absolute;
        top: 24%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 28px;
        letter-spacing: 0.3em;
        color: #e8d2a0;
        opacity: 0;
        text-shadow: 0 0 20px #000;
        transition: opacity 0.4s;
      }
      #cross {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        transform: translate(-50%, -50%);
        z-index: 8;
        pointer-events: none;
        display: none;
      }
      #cross.on {
        display: block;
      }
      #cross i {
        position: absolute;
        background: rgba(235, 245, 248, 0.85);
        box-shadow: 0 0 3px #000;
      }
      #cross i:nth-child(1) {
        left: 12px;
        top: 0;
        width: 2px;
        height: 8px;
      }
      #cross i:nth-child(2) {
        left: 12px;
        bottom: 0;
        width: 2px;
        height: 8px;
      }
      #cross i:nth-child(3) {
        top: 12px;
        left: 0;
        height: 2px;
        width: 8px;
      }
      #cross i:nth-child(4) {
        top: 12px;
        right: 0;
        height: 2px;
        width: 8px;
      }
      #cross i:nth-child(5) {
        left: 12px;
        top: 12px;
        width: 2px;
        height: 2px;
        background: #e8b86a;
      }
      #hitmark {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 30px;
        height: 30px;
        transform: translate(-50%, -50%) rotate(45deg);
        z-index: 9;
        pointer-events: none;
        opacity: 0;
      }
      #hitmark i {
        position: absolute;
        background: #fff;
      }
      #hitmark i:nth-child(1) {
        left: 14px;
        top: 0;
        width: 2px;
        height: 30px;
      }
      #hitmark i:nth-child(2) {
        top: 14px;
        left: 0;
        height: 2px;
        width: 30px;
      }
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          ellipse at center,
          rgba(9, 14, 18, 0.8),
          rgba(4, 7, 10, 0.96)
        );
        backdrop-filter: blur(6px);
      }
      #overlay.hidden {
        display: none;
      }
      .card {
        width: min(700px, 92vw);
        padding: 38px 42px;
        border: 1px solid rgba(160, 190, 200, 0.2);
        background: rgba(10, 16, 20, 0.82);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.4em;
        color: #c08a52;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 42px;
        letter-spacing: 0.08em;
        color: #e9f0f2;
      }
      .sub {
        color: #90a5af;
        font-size: 13px;
        line-height: 1.9;
        margin: 0 0 26px;
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px 26px;
        margin-bottom: 30px;
        font-size: 12px;
        color: #9db1bb;
      }
      .keys div {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        padding-bottom: 7px;
      }
      kbd {
        color: #e8d2a0;
        font: inherit;
      }
      button {
        pointer-events: auto;
        cursor: pointer;
        border: 1px solid #c08a52;
        background: rgba(192, 138, 82, 0.12);
        color: #f0dcb6;
        padding: 13px 30px;
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.18em;
        transition: background 0.2s;
      }
      button:hover {
        background: rgba(192, 138, 82, 0.3);
      }
      #result {
        display: none;
        margin: 18px 0 24px;
        font-size: 14px;
        color: #e8d2a0;
      }
      #err {
        display: none;
        color: #e88;
        font-size: 12px;
        margin-top: 14px;
      }
      .card {
        border-top: 2px solid #c08a52;
        background:
          linear-gradient(rgba(9, 14, 18, 0.88), rgba(9, 14, 18, 0.94)),
          url("./textures/rusty_metal.jpg") center / cover;
      }
      h1 {
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
      }
      .panel-hud {
        background:
          linear-gradient(rgba(8, 14, 18, 0.74), rgba(8, 14, 18, 0.6)),
          url("./textures/concrete_floor.jpg") center / 220px;
        border-color: rgba(192, 138, 82, 0.32);
      }
      #settings {
        margin: 4px 0 24px;
        padding: 12px 14px;
        border: 1px solid rgba(160, 190, 200, 0.18);
      }
      #settings summary {
        cursor: pointer;
        color: #e8d2a0;
        font-size: 12px;
        letter-spacing: 0.16em;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px 22px;
        margin-top: 14px;
      }
      .settings-grid label {
        display: grid;
        grid-template-columns: 88px 1fr 48px;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #9db1bb;
      }
      .settings-grid input {
        width: 100%;
        accent-color: #c08a52;
      }
      .settings-grid output {
        text-align: right;
        color: #e8d2a0;
        font-variant-numeric: tabular-nums;
      }
      #resetCfg {
        margin-top: 14px;
        padding: 7px 14px;
        font-size: 11px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div class="grain"></div>
    <div class="vignette"></div>
    <div id="damage"></div>
    <div id="flash"></div>
    <div id="hud">
      <div class="panel-hud" id="hpBox">
        <div id="hpLabel">生命体征 / VITALS</div>
        <div id="hpNum">100</div>
        <div id="hpBar"><div id="hpFill"></div></div>
      </div>
      <div class="panel-hud" id="statBox">
        <div>波次 <b id="wave">1</b></div>
        <div>击杀 <b id="kills">0</b></div>
        <div>得分 <b id="score">0</b></div>
        <div>连击 <b id="combo">x1.0</b></div>
      </div>
      <div class="panel-hud" id="ammoBox">
        <div id="ammoNum">24 <small>/ ∞</small></div>
        <div id="reload"></div>
      </div>
      <div id="hintBox">
        WASD 移动 · Shift 疾跑 · 空格 跳跃 · 左键射击 · R 换弹 · F 手电 · Esc 暂停/设置
      </div>
      <div id="waveMsg"></div>
    </div>
    <div id="cross"><i></i><i></i><i></i><i></i><i></i></div>
    <div id="hitmark"><i></i><i></i></div>
    <div id="overlay">
      <div class="card">
        <div class="eyebrow">SHIPYARD // SECTOR 07 · THREE.JS</div>
        <h1>废弃船厂：最后一班</h1>
        <p class="sub">
          浓雾、锈蚀的龙门吊、废弃的集装箱堆场。<br />锈蚀哨兵、迅捷猎犬、重装破坏者与巡飞无人机已经苏醒。清空每一波敌人，并维持连击倍率。
        </p>
        <div class="keys">
          <div><span>移动</span><kbd>W A S D</kbd></div>
          <div><span>疾跑</span><kbd>Shift</kbd></div>
          <div><span>跳跃</span><kbd>空格</kbd></div>
          <div><span>射击</span><kbd>鼠标左键</kbd></div>
          <div><span>换弹</span><kbd>R</kbd></div>
          <div><span>手电筒</span><kbd>F</kbd></div>
          <div><span>暂停 / 设置</span><kbd>Esc</kbd></div>
          <div><span>可调参数</span><kbd>下方设置面板</kbd></div>
        </div>
        <div id="result"></div>
        <details id="settings">
          <summary>⚙ 游戏设置 / TUNING</summary>
          <div class="settings-grid">
            <label>鼠标灵敏度 <input type="range" data-cfg="sens" min="0.0008" max="0.006" step="0.0001" /><output></output></label>
            <label>移动速度 <input type="range" data-cfg="speed" min="3" max="10" step="0.1" /><output></output></label>
            <label>疾跑倍率 <input type="range" data-cfg="sprint" min="1.2" max="2.4" step="0.05" /><output></output></label>
            <label>跳跃力度 <input type="range" data-cfg="jump" min="4" max="12" step="0.1" /><output></output></label>
            <label>重力 <input type="range" data-cfg="gravity" min="10" max="30" step="0.5" /><output></output></label>
            <label>敌人生命 <input type="range" data-cfg="enemyHp" min="0.5" max="3" step="0.1" /><output></output></label>
            <label>敌人速度 <input type="range" data-cfg="enemySpeed" min="0.5" max="2.5" step="0.1" /><output></output></label>
            <label>视野 FOV <input type="range" data-cfg="fov" min="60" max="100" step="1" /><output></output></label>
            <label>雾浓度 <input type="range" data-cfg="fog" min="0.005" max="0.04" step="0.001" /><output></output></label>
            <label>手电强度 <input type="range" data-cfg="flash" min="0" max="8" step="0.2" /><output></output></label>
          </div>
          <button id="resetCfg">恢复默认</button>
        </details>
        <button id="startBtn">进入船厂</button>
        <div id="err"></div>
      </div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { clone as cloneSkeleton } from "three/addons/utils/SkeletonUtils.js";

      const $ = (id) => document.getElementById(id);
      const canvas = $("gl");
      const el = {
        hud: $("hud"),
        cross: $("cross"),
        overlay: $("overlay"),
        start: $("startBtn"),
        result: $("result"),
        hp: $("hpNum"),
        hpFill: $("hpFill"),
        wave: $("wave"),
        kills: $("kills"),
        score: $("score"),
        combo: $("combo"),
        ammo: $("ammoNum"),
        reload: $("reload"),
        damage: $("damage"),
        flash: $("flash"),
        hitmark: $("hitmark"),
        waveMsg: $("waveMsg"),
        err: $("err"),
      };

      try {
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.6));
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.autoClear = false;

        const FOG_COLOR = 0x566168;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(FOG_COLOR);
        scene.fog = new THREE.FogExp2(FOG_COLOR, 0.016);

        const camera = new THREE.PerspectiveCamera(
          68,
          innerWidth / innerHeight,
          0.05,
          320,
        );
        camera.position.set(0, 1.65, 18);
        scene.add(camera);

        scene.add(new THREE.HemisphereLight(0xa8bac4, 0x2a2119, 0.95));
        const sun = new THREE.DirectionalLight(0xffd8a4, 1.35);
        sun.position.set(-35, 65, 25);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.left = -70;
        sun.shadow.camera.right = 70;
        sun.shadow.camera.top = 70;
        sun.shadow.camera.bottom = -70;
        sun.shadow.camera.far = 180;
        sun.shadow.camera.updateProjectionMatrix();
        scene.add(sun);

        const flashlight = new THREE.SpotLight(
          0xffe3b8,
          0,
          75,
          0.33,
          0.55,
          1.2,
        );
        flashlight.position.set(0, -0.04, 0);
        camera.add(flashlight);
        camera.add(flashlight.target);
        flashlight.target.position.set(0, -0.04, -12);
        const muzzleLight = new THREE.PointLight(0xffb35c, 0, 14, 2);
        muzzleLight.position.set(0, 0, -1.2);
        camera.add(muzzleLight);

        // 天空穹顶
        const sky = new THREE.Mesh(
          new THREE.SphereGeometry(240, 32, 16),
          new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            fog: false,
            vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
            fragmentShader: `precision mediump float; varying vec3 vP;
      void main(){
        float h = clamp(normalize(vP).y*0.5+0.5, 0.0, 1.0);
        vec3 col = mix(vec3(0.42,0.46,0.49), vec3(0.08,0.11,0.15), smoothstep(0.48,0.92,h));
        float sun = exp(-length((vec2(h,atan(vP.z,vP.x)*0.16) - vec2(0.56,0.24))*vec2(3.0,1.0))*5.0);
        col += vec3(0.55,0.36,0.18)*sun*0.45;
        gl_FragColor = vec4(col,1.0);
      }`,
          }),
        );
        scene.add(sky);

        // ---------- 材质与工具 ----------
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const std = (color, rough = 0.85, metal = 0.22) =>
          new THREE.MeshStandardMaterial({
            color,
            roughness: rough,
            metalness: metal,
          });
        const texLoader = new THREE.TextureLoader();
        function tex(file, rx, ry) {
          const t = texLoader.load("./textures/" + file);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(rx, ry);
          t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return t;
        }
        const T = {
          concrete: tex("concrete_floor.jpg", 24, 28),
          rust: tex("rusty_metal.jpg", 1, 1),
          corrugated: tex("corrugated_iron.jpg", 1, 1),
          container: tex("container_side.jpg", 1, 1),
          factory: tex("factory_wall.jpg", 3, 1),
          grate: tex("metal_grate.jpg", 4, 1),
          painted: tex("rusty_painted_metal.jpg", 1, 1),
        };
        const M = {
          concrete: std(0x9aa0a2, 0.96, 0.05),
          dark: std(0x22272b, 0.9, 0.35),
          steel: std(0x3d474d, 0.72, 0.55),
          rust: std(0xc0b6b0, 0.95, 0.3),
          yellow: std(0xa87a2e, 0.88, 0.35),
          ship: std(0xc8b8ad, 0.92, 0.3),
          lamp: new THREE.MeshBasicMaterial({ color: 0xffcf85 }),
        };
        M.factory = std(0xb4b0aa, 0.95, 0.2);
        M.grate = std(0xa9a49c, 0.9, 0.4);
        M.painted = std(0xb8b3ad, 0.92, 0.35);
        M.concrete.map = T.concrete;
        M.rust.map = T.rust;
        M.ship.map = T.corrugated;
        M.factory.map = T.factory;
        M.grate.map = T.grate;
        M.painted.map = T.painted;
        const containerHues = [0x5b8ca6, 0xa06a4a, 0x6b957b, 0xa08a5c, 0x8a6060];
        const containerMats = containerHues.map((c) => std(c, 0.9, 0.3));
        containerMats.forEach((m) => (m.map = T.container));
        const basicCache = new Map();
        function basic(color) {
          if (!basicCache.has(color))
            basicCache.set(color, new THREE.MeshBasicMaterial({ color }));
          return basicCache.get(color);
        }

        let robotTemplate = null,
          robotAnimations = [],
          robotScale = 1,
          robotOffsetY = 0,
          deathClip = null;
        new GLTFLoader().load(
          "./assets/models/RobotExpressive.glb",
          (gltf) => {
            robotTemplate = gltf.scene;
            robotAnimations = gltf.animations;
            deathClip = THREE.AnimationClip.findByName(gltf.animations, "Death");
            robotTemplate.updateMatrixWorld(true);
            const box = new THREE.Box3();
            const partBox = new THREE.Box3();
            robotTemplate.traverse((o) => {
              if (!o.isMesh) return;
              if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
              partBox.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
              box.union(partBox);
            });
            robotScale = 1.9 / Math.max(box.max.y - box.min.y, 0.001);
            robotOffsetY = -box.min.y * robotScale;
            robotTemplate.traverse((o) => {
              if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
              }
            });
          },
          undefined,
          (err) => console.warn("机器人模型加载失败，使用备用几何体", err),
        );

        const colliders = [];
        function collider(x, y, z, sx, sy, sz) {
          colliders.push({
            min: new THREE.Vector3(x - sx / 2, y - sy / 2, z - sz / 2),
            max: new THREE.Vector3(x + sx / 2, y + sy / 2, z + sz / 2),
          });
        }
        function addBox(
          x,
          y,
          z,
          sx,
          sy,
          sz,
          material,
          collide = true,
          cast = true,
        ) {
          const m = new THREE.Mesh(boxGeo, material);
          m.position.set(x, y, z);
          m.scale.set(sx, sy, sz);
          m.castShadow = cast;
          m.receiveShadow = true;
          scene.add(m);
          if (collide) collider(x, y, z, sx, sy, sz);
          return m;
        }
        function addCylinder(x, y, z, r, h, material) {
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(r, r, h, 10),
            material,
          );
          m.position.set(x, y, z);
          m.castShadow = true;
          scene.add(m);
          return m;
        }

        // ---------- 场景 ----------
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(120, 140),
          M.concrete,
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(16, 0, -25);
        ground.receiveShadow = true;
        scene.add(ground);
        collider(16, -0.5, -25, 60, 1, 110);
        addBox(
          -32,
          -3,
          -25,
          40,
          1,
          110,
          std(0x192429, 0.98, 0.1),
          false,
          false,
        );
        colliders.push({
          min: new THREE.Vector3(-70, -6, -100),
          max: new THREE.Vector3(-14.2, 12, 40),
          invisible: true,
        });

        // 水面

          if (!audio) return;
          const n = Math.floor(audio.sampleRate * dur),
            b = audio.createBuffer(1, n, audio.sampleRate),
            d = b.getChannelData(0);
          for (let i = 0; i < n; i++)
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
          const src = audio.createBufferSource();
          src.buffer = b;
          const f = audio.createBiquadFilter();
          f.type = "lowpass";
          f.frequency.value = freq;
          const g = audio.createGain();
          g.gain.value = vol;
          src.connect(f).connect(g).connect(audio.destination);
          src.start();
        }
        function tone(freq, dur, vol, type = "sine") {
          if (!audio) return;
          const o = audio.createOscillator(),
            g = audio.createGain();
          o.type = type;
          o.frequency.setValueAtTime(freq, audio.currentTime);
          o.frequency.exponentialRampToValueAtTime(
            freq * 1.6,
            audio.currentTime + dur,
          );
          g.gain.setValueAtTime(vol, audio.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
          o.connect(g).connect(audio.destination);
          o.start();
          o.stop(audio.currentTime + dur);
        }

        // ---------- 碰撞与射线 ----------
        function rayAABB(o, d, b) {
          let tmin = 0,
            tmax = Infinity;
          const lo = [b.min.x, b.min.y, b.min.z],
            hi = [b.max.x, b.max.y, b.max.z],
            oo = [o.x, o.y, o.z],
            dd = [d.x, d.y, d.z];
          for (let i = 0; i < 3; i++) {
            if (Math.abs(dd[i]) < 1e-6) {
              if (oo[i] < lo[i] || oo[i] > hi[i]) return Infinity;
            } else {
              let t1 = (lo[i] - oo[i]) / dd[i],
                t2 = (hi[i] - oo[i]) / dd[i];
              if (t1 > t2) {
                const q = t1;
                t1 = t2;
                t2 = q;
              }
              tmin = Math.max(tmin, t1);
              tmax = Math.min(tmax, t2);
              if (tmin > tmax) return Infinity;
            }
          }
          return tmin > 0.05 ? tmin : Infinity;
        }
        function raySphere(o, d, c, r) {
          const oc = new THREE.Vector3().subVectors(o, c);
          const b = oc.dot(d),
            cc = oc.lengthSq() - r * r,
            disc = b * b - cc;
          if (disc < 0) return Infinity;
          const t = -b - Math.sqrt(disc);
          return t > 0.05 ? t : Infinity;
        }
        function insideWorld(p) {
          for (const b of colliders)
            if (
              p.x > b.min.x &&
              p.x < b.max.x &&
              p.y > b.min.y &&
              p.y < b.max.y &&
              p.z > b.min.z &&
              p.z < b.max.z
            )
              return true;
          return false;
        }
        function resolve(pos, r, feetY = 0) {
          for (let it = 0; it < 3; it++)
            for (const b of colliders) {
              if (b.max.y < feetY + 0.2 || b.min.y > feetY + 1.6) continue;
              if (
                pos.x + r < b.min.x ||
                pos.x - r > b.max.x ||
                pos.z + r < b.min.z ||
                pos.z - r > b.max.z
              )
                continue;
              const pl = pos.x + r - b.min.x,
                pr = b.max.x - (pos.x - r),
                pb = pos.z + r - b.min.z,
                pf = b.max.z - (pos.z - r);
              const m = Math.min(pl, pr, pb, pf);
              if (m === pl) pos.x = b.min.x - r;
              else if (m === pr) pos.x = b.max.x + r;
              else if (m === pb) pos.z = b.min.z - r;
              else pos.z = b.max.z + r;
            }
        }

          for (const b of colliders) {

            if (t < best) {

              target = null;
              hitP = o.clone().addScaledVector(d, t);

          },
        };
        function pickEnemyType() {
          const r = Math.random();
          if (S.wave >= 4 && r < 0.18) return "drone";
          if (S.wave >= 3 && r < 0.38) return "brute";
          if (S.wave >= 2 && r < 0.66) return "hound";
          return "guard";
        }
        function tintEnemyMesh(mesh, color) {
          mesh.traverse((o) => {
            if (!o.isMesh || !o.material || !o.material.color) return;
            o.material = o.material.clone();
            o.material.color.multiply(color);
          });
        }
        function buildFallbackSoldier() {
          const mesh = new THREE.Group();
          const body = new THREE.Mesh(boxGeo, std(0x444d52, 0.8, 0.5));
          body.position.y = 0.72;
          body.scale.set(0.82, 1.1, 0.62);
          body.castShadow = true;
          mesh.add(body);
          const head = new THREE.Mesh(boxGeo, std(0x575e62, 0.8, 0.5));
          head.position.y = 1.42;
          head.scale.set(0.56, 0.42, 0.52);
          mesh.add(head);
          const eye = new THREE.Mesh(boxGeo, basic(0xff2a12));
          eye.position.set(0, 1.43, 0.28);
          eye.scale.set(0.34, 0.09, 0.06);
          mesh.add(eye);
          return mesh;
        }
        function buildBrute() {
          const g = new THREE.Group();
          const armor = std(0x6b3a2f, 0.72, 0.42);
          const dark = std(0x2f3436, 0.9, 0.3);
          const body = new THREE.Mesh(boxGeo, armor);
          body.position.y = 1.05;
          body.scale.set(1.25, 1.4, 0.9);
          body.castShadow = true;
          g.add(body);
          const head = new THREE.Mesh(boxGeo, dark);
          head.position.y = 2.05;
          head.scale.set(0.58, 0.48, 0.55);
          head.castShadow = true;
          g.add(head);
          for (const side of [-1, 1]) {
            const shoulder = new THREE.Mesh(boxGeo, armor);
            shoulder.position.set(side * 0.78, 1.62, 0);
            shoulder.scale.set(0.5, 0.5, 0.75);
            shoulder.castShadow = true;
            g.add(shoulder);
            const leg = new THREE.Mesh(boxGeo, dark);
            leg.position.set(side * 0.36, 0.42, 0);
            leg.scale.set(0.42, 0.85, 0.5);
            leg.castShadow = true;
            g.add(leg);
          }
          const eye = new THREE.Mesh(boxGeo, basic(0xff3b1f));
          eye.position.set(0, 2.08, 0.3);
          eye.scale.set(0.4, 0.1, 0.06);
          g.add(eye);
          return g;
        }
        function buildDrone() {
          const g = new THREE.Group();
          const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.42, 16, 12),
            std(0x253a42, 0.35, 0.7),
          );
          core.castShadow = true;
          g.add(core);
          const eye = new THREE.Mesh(
            new THREE.SphereGeometry(0.15, 12, 8),
            basic(0xff3b1f),
          );
          eye.position.z = 0.38;
          g.add(eye);
          const ring = new THREE.Mesh(
            new THREE.TorusGeometry(0.58, 0.035, 8, 24),
            basic(0x4cc9f0),
          );
          ring.rotation.x = Math.PI / 2;
          g.add(ring);
          return g;
        }
        function spawnEnemy() {
          const p = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
          const typeId = pickEnemyType();
          const type = ENEMY_TYPES[typeId];
          const elite =
            S.wave >= 3 &&
            Math.random() < Math.min(0.06 + S.wave * 0.02, 0.28);
          const scaleFactor = type.scale * (elite ? 1.12 : 1);
          let mesh, mixer = null, walkAction = null, baseY = 0;

          if (type.model === "brute") {
            mesh = buildBrute();
          } else if (type.model === "drone") {
            mesh = buildDrone();
            baseY = 2.1 + Math.random() * 0.6;
          } else if (robotTemplate) {
            mesh = cloneSkeleton(robotTemplate);
            mesh.scale.setScalar(robotScale * scaleFactor);
            baseY = robotOffsetY * scaleFactor;
            mixer = new THREE.AnimationMixer(mesh);
            const walkClip = THREE.AnimationClip.findByName(
              robotAnimations,
              "Walking",
            );
            if (walkClip) {
              walkAction = mixer.clipAction(walkClip);
              walkAction.play();
            }
          } else {
            mesh = buildFallbackSoldier();
            mesh.scale.setScalar(scaleFactor);
          }

          const tint = new THREE.Color(type.tint);
          if (elite) tint.lerp(new THREE.Color(0xffd166), 0.5);
          tintEnemyMesh(mesh, tint);
          if (elite) {
            const marker = new THREE.Mesh(
              new THREE.SphereGeometry(0.12, 10, 8),
              basic(0xffd166),
            );
            marker.position.y = type.model === "drone" ? 0.72 : 2.3;
            mesh.add(marker);
          }

          const flashMats = [];
          mesh.traverse((o) => {
            if (o.isMesh && o.material && o.material.emissive)
              flashMats.push(o.material);
          });

          mesh.position.set(
            p[0] + Math.random() * 3 - 1.5,
            baseY,
            p[1] + Math.random() * 3 - 1.5,
          );
          scene.add(mesh);
          const hpMax =
            (65 + S.wave * 6) * CFG.enemyHp * type.hp * (elite ? 1.6 : 1);
          S.enemies.push({
            mesh,
            mixer,
            walkAction,
            flashMats,
            fallback: !robotTemplate && type.model === "robot",
            typeId,
            elite,
            baseY,
            hp: hpMax,
            hpMax,
            speedMul: type.speed * (elite ? 1.15 : 1),
            meleeMul: type.melee * (elite ? 1.35 : 1),
            rangedMul: type.ranged * (elite ? 1.35 : 1),
            score: type.score * (elite ? 2 : 1),
            hitY:
              type.model === "drone"
                ? 0
                : (type.model === "brute" ? 1.25 : 0.98) * scaleFactor,
            hitR:
              (type.model === "brute" ? 0.88 : 0.62) * scaleFactor,
            flash: 0,
            attack: 0,
            shoot: 1 + Math.random() * 2,
            gait: Math.random() * 6,
            dying: false,
            deathTimer: 0,
          });
        }

        function update(dt) {
          S.time += dt;
          S.muzzle = Math.max(0, S.muzzle - dt * 7);
          S.recoil = Math.max(0, S.recoil - dt * 5);
          S.dmgFlash = Math.max(0, S.dmgFlash - dt * 1.8);
          if (S.hitTimer > 0) {
            S.hitTimer -= dt;
            if (S.hitTimer <= 0) el.hitmark.style.opacity = 0;
          }
          if (S.waveMsgTimer > 0) {
            S.waveMsgTimer -= dt;
            if (S.waveMsgTimer <= 0) el.waveMsg.style.opacity = 0;
          }
          if (S.comboTimer > 0) {
            S.comboTimer -= dt;
            if (S.comboTimer <= 0) S.combo = 0;
          }
          if (S.reloading > 0) {
            S.reloading -= dt;
            if (S.reloading <= 0) {
              S.ammo = 24;
              S.reloading = 0;
            }
          }

          flashlight.intensity = S.flash ? CFG.flash : 0;
          muzzleLight.intensity = S.muzzle * 4;

          camera.rotation.order = "YXZ";
          camera.rotation.y = P.yaw;
          camera.rotation.x = P.pitch;
          camera.updateMatrixWorld();

          const sprint = keys.ShiftLeft || keys.ShiftRight,
            speed = sprint ? CFG.speed * CFG.sprint : CFG.speed;
          let f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0),
            r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
          if (f || r) {
            const l = Math.hypot(f, r);
            f /= l;
            r /= l;
            const fwd = new THREE.Vector3();
            camera.getWorldDirection(fwd);
            fwd.y = 0;
            fwd.normalize();
            const right = new THREE.Vector3()
              .crossVectors(fwd, new THREE.Vector3(0, 1, 0))
              .normalize();
            const pos = camera.position.clone();
            pos
              .addScaledVector(fwd, f * speed * dt)
              .addScaledVector(right, r * speed * dt);
            resolve(pos, 0.38, camera.position.y - EYE_H);
            camera.position.x = pos.x;
            camera.position.z = pos.z;
          }
          camera.position.x = Math.max(-13, Math.min(45, camera.position.x));
          camera.position.z = Math.max(-60, Math.min(29, camera.position.z));

          const feetBefore = camera.position.y - EYE_H;
          P.vy -= CFG.gravity * dt;
          const nextY = camera.position.y + P.vy * dt;
          const feet = nextY - EYE_H;
          let groundY = 0;
          for (const b of colliders) {
            if (b.invisible) continue;
            if (
              camera.position.x < b.min.x - 0.3 ||
              camera.position.x > b.max.x + 0.3 ||
              camera.position.z < b.min.z - 0.3 ||
              camera.position.z > b.max.z + 0.3
            )
              continue;
            if (b.max.y <= feetBefore + 0.35 && b.max.y > groundY)
              groundY = b.max.y;
          }
          if (feet <= groundY) {
            camera.position.y = groundY + EYE_H;
            P.vy = 0;
            P.grounded = true;
          } else {
            camera.position.y = nextY;
            P.grounded = false;
          }

          if (S.breakTimer > 0) {
            S.breakTimer -= dt;
            if (S.breakTimer <= 0) {
              S.wave++;
              S.spawnLeft = 2 + S.wave;
              S.spawnTimer = 0.6;
              showWave("第 " + S.wave + " 波 // 敌情接近");
            }
          } else if (S.spawnLeft > 0) {
            S.spawnTimer -= dt;
            if (S.spawnTimer <= 0) {
              spawnEnemy();
              S.spawnLeft--;
              S.spawnTimer = 1.1;
            }
          } else if (S.enemies.length === 0) {
            S.breakTimer = 4;
            showWave("区域清空 // 休整");
          }

          for (let i = S.enemies.length - 1; i >= 0; i--) {
            const e = S.enemies[i];
            if (e.mixer) e.mixer.update(dt);
            if (e.walkAction)
              e.walkAction.timeScale = CFG.enemySpeed * e.speedMul;
            if (e.dying) {
              e.deathTimer -= dt;
              if (e.deathTimer <= 0) {
                scene.remove(e.mesh);
                S.enemies.splice(i, 1);
              }
              continue;
            }
            e.flash = Math.max(0, e.flash - dt);
            e.gait += dt * 7;
            e.attack -= dt;
            e.shoot -= dt;
            for (const mat of e.flashMats)
              mat.emissive.setHex(e.flash > 0 ? 0x771100 : 0x000000);
            if (e.typeId === "drone")
              e.mesh.position.y =
                e.baseY + Math.sin(S.time * 2.2 + e.gait) * 0.22;
            const dx = camera.position.x - e.mesh.position.x,
              dz = camera.position.z - e.mesh.position.z;
            const dist = Math.hypot(dx, dz) || 1,
              nx = dx / dist,
              nz = dz / dist;
            e.mesh.rotation.y = Math.atan2(nx, nz);
            if (dist > 7) {
              const spd =
                (1.9 + S.wave * 0.12) * CFG.enemySpeed * e.speedMul;
              const pos = e.mesh.position.clone();
              pos.x += nx * spd * dt + Math.sin(e.gait) * 0.12 * dt;
              pos.z += nz * spd * dt;
              resolve(pos, 0.42);
              e.mesh.position.x = pos.x;
              e.mesh.position.z = pos.z;
            } else if (e.meleeMul > 0 && dist < 2.2 && e.attack <= 0) {
              e.attack = 1.1;
              hurt(Math.round((7 + S.wave) * e.meleeMul));
            }
            if (e.rangedMul > 0 && dist < 32 && e.shoot <= 0 && dist > 3) {
              e.shoot =
                (e.typeId === "drone" ? 1.3 : 1.9) + Math.random() * 1.4;
              const j = 0.045;
              const dir = new THREE.Vector3(
                nx + (Math.random() - 0.5) * j,
                0.06 + (Math.random() - 0.5) * j * 0.5,
                nz + (Math.random() - 0.5) * j,
              )
                .normalize()
                .multiplyScalar(e.typeId === "drone" ? 20 : 17);
              const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.09, 8, 6),
                basic(0xff8a2a),
              );
              mesh.position.set(
                e.mesh.position.x,
                e.mesh.position.y + e.hitY * 0.85,
                e.mesh.position.z,
              );
              const dmg = Math.round((9 + S.wave) * e.rangedMul);
              scene.add(mesh);
              S.shots.push({ mesh, v: dir, life: 5, dmg });
              sfx.enemy();
            }
          }

          for (let i = S.shots.length - 1; i >= 0; i--) {
            const s = S.shots[i];
            let dead = false;
            for (let k = 0; k < 3; k++) {
              s.mesh.position.addScaledVector(s.v, dt / 3);
              s.v.y -= (2.2 * dt) / 3;
              if (s.mesh.position.distanceTo(camera.position) < 0.85) {
                hurt(s.dmg || 9 + S.wave);
                dead = true;
                break;
              }
              if (s.mesh.position.y < 0.05 || insideWorld(s.mesh.position)) {
                spawnParts(s.mesh.position, 5, 0xff8026, 0.5);
                dead = true;
                break;
              }
            }
            s.life -= dt;
            if (dead || s.life <= 0) {
              scene.remove(s.mesh);
              s.mesh.geometry.dispose();
              S.shots.splice(i, 1);
            }
          }

          for (let i = S.parts.length - 1; i >= 0; i--) {
            const p = S.parts[i];
            p.life -= dt;
            p.v.y -= 9 * dt;
            p.obj.position.addScaledVector(p.v, dt);
            if (p.obj.position.y < 0.05) {
              p.obj.position.y = 0.05;
              p.v.y *= -0.3;
              p.v.x *= 0.6;
              p.v.z *= 0.6;
            }
            const k = Math.max(0, p.life / p.max);
            p.obj.scale.setScalar(p.s * (0.5 + k));
            if (p.life <= 0) {
              scene.remove(p.obj);
              S.parts.splice(i, 1);
            }
          }

          for (let i = S.meds.length - 1; i >= 0; i--) {
            const m = S.meds[i];
            m.spin += dt * 1.6;
            m.mesh.rotation.y = m.spin;
            m.mesh.position.y = 0.5 + Math.sin(S.time * 2) * 0.1;
            const dx = m.mesh.position.x - camera.position.x,
              dz = m.mesh.position.z - camera.position.z;
            if (Math.hypot(dx, dz) < 1.3) {
              S.hp = Math.min(100, S.hp + 32);
              scene.remove(m.mesh);
              S.meds.splice(i, 1);
              tone(880, 0.15, 0.1);
              showWave("+32 生命");
            }
          }

          el.hp.textContent = Math.ceil(S.hp);
          el.hpFill.style.width = S.hp + "%";
          el.wave.textContent = S.wave;
          el.kills.textContent = S.kills;
          el.score.textContent = S.score;
          el.combo.textContent = "x" + comboMultiplier().toFixed(1);
          el.ammo.innerHTML = S.ammo + " <small>/ ∞</small>";
          el.reload.textContent =
            S.reloading > 0
              ? "装填中 " + Math.round((1 - S.reloading / 1.55) * 100) + "%"
              : S.ammo === 0
                ? "按 R 换弹"
                : "";
          el.damage.style.opacity = (S.dmgFlash * 0.65).toFixed(3);
          el.flash.style.opacity = (S.muzzle * 0.1).toFixed(3);
        }

        function animateWater() {
          const p = waterGeo.attributes.position;
          for (let i = 0; i < p.count; i++) {
            const x = p.getX(i),
              z = p.getZ(i);
            p.setY(
              i,
              Math.sin(x * 0.33 + S.time * 1.1) * 0.045 +
                Math.sin(z * 0.26 + S.time * 0.77) * 0.04,
            );
          }
          p.needsUpdate = true;
          waterGeo.computeVertexNormals();
        }

        function resize() {
          renderer.setSize(innerWidth, innerHeight);
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          gunCamera.aspect = innerWidth / innerHeight;
          gunCamera.updateProjectionMatrix();
        }
        addEventListener("resize", resize);

        function loop() {
          requestAnimationFrame(loop);
          const dt = Math.min(
            (performance.now() - (loop.last || performance.now())) / 1000,
            0.05,
          );
          loop.last = performance.now();
          if (S.started && !S.paused && !S.over) update(dt);
          else S.time += dt * 0.15;
          animateWater();

          gunGroup.position.set(
            0.32 + Math.sin(S.time * 1.4) * 0.004,
            -0.27 + Math.cos(S.time * 1.1) * 0.005 - S.recoil * 0.035,
            -0.55 + S.recoil * 0.09,
          );
          gunGroup.rotation.y = -0.05;
          flashMesh.visible = S.muzzle > 0;
          flashMesh.scale.setScalar(0.18 * S.muzzle);
          sky.position.copy(camera.position);

          renderer.clear();
          renderer.render(scene, camera);
          renderer.clearDepth();
          renderer.render(gunScene, gunCamera);
        }
        loop();
      } catch (err) {
        el.err.style.display = "block";
        el.err.textContent = "初始化失败：" + err.message;
        console.error(err);
      }
    </script>
  </body>
